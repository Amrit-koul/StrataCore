<!--
  ════════════════════════════════════════════════════════════════════
  CHART VISUALIZATION PANEL — paste into your index.html
  Requires: Chart.js (already included via CDN script tag below)
  ════════════════════════════════════════════════════════════════════

  STEP 1 — Add this <script> tag in your <head> or before </body>:
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  STEP 2 — Paste the panel HTML wherever you want charts to appear
  (after your results table, for example).

  STEP 3 — Call `renderChart(sql, question)` after every successful query.
  Example — in your existing fetch("/query") success handler:
    .then(data => {
        displayResults(data);          // your existing function
        renderChart(data.sql, question); // ← add this line
    })
  ════════════════════════════════════════════════════════════════════
-->

<!-- ── CHART PANEL HTML ─────────────────────────────────────────── -->
<div id="chart-panel" style="display:none; margin-top:2rem;">

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.7">
        <rect x="3" y="12" width="3" height="5" rx="1"/><rect x="8.5" y="8" width="3" height="9" rx="1"/><rect x="14" y="4" width="3" height="13" rx="1"/>
      </svg>
      <span id="chart-title" style="font-size:.85rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; opacity:.65;"></span>
    </div>
    <!-- Type switcher -->
    <div id="chart-switcher" style="display:flex; gap:.4rem;"></div>
  </div>

  <!-- Stat card (single number result) -->
  <div id="chart-stat" style="display:none; text-align:center; padding:2rem 1rem;">
    <div id="stat-value" style="font-size:3.5rem; font-weight:700; letter-spacing:-.02em; line-height:1;"></div>
    <div id="stat-label" style="margin-top:.5rem; font-size:.9rem; opacity:.55;"></div>
  </div>

  <!-- Canvas for Chart.js -->
  <div style="position:relative;">
    <canvas id="chart-canvas" style="display:none; max-height:380px;"></canvas>
  </div>

  <div id="chart-error" style="display:none; padding:1rem; border-radius:8px; background:#fef2f2; color:#b91c1c; font-size:.85rem; margin-top:.5rem;"></div>
  <div id="chart-loading" style="display:none; text-align:center; padding:2rem; opacity:.4; font-size:.9rem;">Building chart…</div>
</div>
<!-- ── END CHART PANEL HTML ─────────────────────────────────────── -->


<!-- ── CHART STYLES — add to your <style> block ─────────────────── -->
<style>
#chart-panel {
  background: var(--surface, #fff);
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 14px;
  padding: 1.4rem 1.6rem;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
  transition: opacity .3s ease;
}

.chart-type-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .35rem .75rem;
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 8px;
  background: transparent;
  font-size: .78rem;
  font-weight: 500;
  cursor: pointer;
  color: inherit;
  opacity: .6;
  transition: all .15s ease;
}
.chart-type-btn:hover { opacity: 1; border-color: rgba(0,0,0,.25); }
.chart-type-btn.active {
  opacity: 1;
  background: #6366f1;
  border-color: #6366f1;
  color: #fff;
}
</style>
<!-- ── END CHART STYLES ──────────────────────────────────────────── -->


<!-- ── CHART JAVASCRIPT — add before </body> ────────────────────── -->
<script>
(function () {
  let _chartInstance = null;
  let _lastData = null;   // cache so type-switcher doesn't re-fetch

  // ── Public API ────────────────────────────────────────────────
  window.renderChart = async function (sql, question) {
    const panel  = document.getElementById("chart-panel");
    const loading = document.getElementById("chart-loading");
    const errBox  = document.getElementById("chart-error");
    const canvas  = document.getElementById("chart-canvas");
    const stat    = document.getElementById("chart-stat");

    panel.style.display  = "block";
    loading.style.display = "block";
    errBox.style.display  = "none";
    canvas.style.display  = "none";
    stat.style.display    = "none";

    try {
      const res  = await fetch("/chart-data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, question }),
      });
      const data = await res.json();
      loading.style.display = "none";

      if (data.error) { showChartError(data.error); return; }

      _lastData = data;
      _drawChart(data, data.type);

    } catch (e) {
      loading.style.display = "none";
      showChartError("Could not load chart data.");
    }
  };

  // ── Draw / redraw ─────────────────────────────────────────────
  function _drawChart(data, type) {
    const canvas  = document.getElementById("chart-canvas");
    const stat    = document.getElementById("chart-stat");
    const title   = document.getElementById("chart-title");
    const switcher = document.getElementById("chart-switcher");

    // Title
    title.textContent = data.question || "Chart";

    // Stat card
    if (type === "stat") {
      canvas.style.display = "none";
      stat.style.display   = "block";
      document.getElementById("stat-value").textContent = _fmt(data.value);
      document.getElementById("stat-label").textContent  = data.label;
      switcher.innerHTML = "";
      return;
    }

    stat.style.display   = "none";
    canvas.style.display = "block";

    // Type switcher buttons
    const validTypes = _getValidTypes(data);
    switcher.innerHTML = validTypes.map(t =>
      `<button class="chart-type-btn ${t === type ? "active" : ""}"
        onclick="window._switchChart('${t}')">${_typeIcon(t)} ${t}</button>`
    ).join("");

    // Destroy old chart
    if (_chartInstance) { _chartInstance.destroy(); _chartInstance = null; }

    const ctx = canvas.getContext("2d");
    const palette = data.datasets.map(d => d.color);

    if (type === "pie" || type === "doughnut") {
      _chartInstance = new Chart(ctx, {
        type,
        data: {
          labels: data.labels,
          datasets: [{
            data: data.datasets[0]?.data || [],
            backgroundColor: _genPalette(data.labels.length),
            borderWidth: 2,
            borderColor: "#fff",
          }]
        },
        options: _pieOptions(data),
      });
    } else {
      _chartInstance = new Chart(ctx, {
        type,
        data: {
          labels: data.labels,
          datasets: data.datasets.map((ds, i) => ({
            label: ds.label,
            data: ds.data,
            backgroundColor: type === "line" ? "transparent" : ds.color + "cc",
            borderColor: ds.color,
            borderWidth: 2.5,
            borderRadius: type === "bar" ? 6 : 0,
            pointRadius: type === "line" ? 4 : 0,
            pointHoverRadius: 6,
            tension: 0.4,
            fill: type === "line" && i === 0 ? {
              target: "origin",
              above: ds.color + "18",
            } : false,
          }))
        },
        options: _barLineOptions(data, type),
      });
    }
  }

  // ── Switch chart type ─────────────────────────────────────────
  window._switchChart = function (type) {
    if (_lastData) _drawChart(_lastData, type);
  };

  // ── Helpers ───────────────────────────────────────────────────
  function showChartError(msg) {
    const e = document.getElementById("chart-error");
    e.style.display = "block";
    e.textContent   = "Chart: " + msg;
    document.getElementById("chart-panel").style.display = "block";
  }

  function _fmt(v) {
    const n = parseFloat(v);
    if (isNaN(n)) return v;
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + "K";
    return Number.isInteger(n) ? n.toLocaleString() : n.toFixed(2);
  }

  function _genPalette(n) {
    const base = ["#6366f1","#f59e0b","#10b981","#ef4444",
                  "#8b5cf6","#06b6d4","#f97316","#ec4899"];
    return Array.from({ length: n }, (_, i) => base[i % base.length]);
  }

  function _getValidTypes(data) {
    const small = data.labels && data.labels.length <= 10;
    const types = ["bar", "line"];
    if (small) types.push("pie", "doughnut");
    return types;
  }

  function _typeIcon(t) {
    return { bar:"▦", line:"∿", pie:"◕", doughnut:"◎" }[t] || "▦";
  }

  function _commonOptions() {
    return {
      responsive: true,
      maintainAspectRatio: true,
      animation: { duration: 400, easing: "easeOutQuart" },
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            padding: 16,
            usePointStyle: true,
            pointStyleWidth: 8,
            font: { size: 12, family: "inherit" },
          }
        },
        tooltip: {
          backgroundColor: "rgba(0,0,0,.8)",
          padding: 10,
          cornerRadius: 8,
          callbacks: {
            label: ctx => " " + _fmt(ctx.parsed.y ?? ctx.parsed),
          }
        }
      }
    };
  }

  function _barLineOptions(data, type) {
    const opts = _commonOptions();
    opts.scales = {
      x: {
        grid: { display: false },
        ticks: {
          maxRotation: 35,
          font: { size: 11 },
          maxTicksLimit: 16,
        },
        border: { display: false },
      },
      y: {
        grid: { color: "rgba(0,0,0,.05)" },
        ticks: {
          font: { size: 11 },
          callback: v => _fmt(v),
        },
        border: { display: false },
      }
    };
    return opts;
  }

  function _pieOptions(data) {
    const opts = _commonOptions();
    opts.plugins.tooltip.callbacks = {
      label: ctx => {
        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
        const pct   = total ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
        return ` ${_fmt(ctx.parsed)}  (${pct}%)`;
      }
    };
    return opts;
  }
})();
</script>
<!-- ── END CHART JAVASCRIPT ──────────────────────────────────────── -->
